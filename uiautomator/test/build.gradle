apply plugin: "com.android.application"

android {
    namespace "com.openatx.xtest.nova.uiautomator.test"
    compileSdk 36

    defaultConfig {
        applicationId "com.openatx.xtest.nova.uiautomator.test"
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName "0.2.0-platform-only"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencyLocking {
    lockAllConfigurations()
}
